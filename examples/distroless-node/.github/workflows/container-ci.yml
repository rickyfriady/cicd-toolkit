name: "Container CI & Security Gate"

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-secure-container:
    name: "Build, Scan & Sign Container"
    uses: rickyfriady/cicd-toolkit/.github/workflows/docker-build-secure.yml@v1
    with:
      image-name: "ghcr.io/${{ github.repository_owner }}/my-fintech-service"
      dockerfile: "Dockerfile"
      context: "."
      platforms: "linux/amd64,linux/arm64"
      push: ${{ github.event_name != 'pull_request' }}
      scan-severity: "CRITICAL,HIGH"
      fail-on-cve: true
      generate-sbom: true
      sign-image: true
    secrets: inherit
