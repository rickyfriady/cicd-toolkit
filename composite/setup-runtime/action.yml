name: "Setup Runtime & Dependencies"
description: "Cross-platform runtime setup supporting pnpm and bun with built-in cache and frozen install"
inputs:
  package-manager:
    description: "Package manager to use: 'pnpm' | 'bun' | 'auto'"
    required: false
    default: "auto"
  node-version:
    description: "Node.js version to setup when using pnpm (default: 'lts/*')"
    required: false
    default: "lts/*"
  pnpm-version:
    description: "Fallback PNPM version to install when package.json does not declare packageManager (default: '12.15.0')"
    required: false
    default: "12.15.0"
  bun-version:
    description: "Bun version to install when using bun (default: 'latest' / LTS)"
    required: false
    default: "latest"
  install-deps:
    description: "Whether to execute frozen-lockfile installation"
    required: false
    default: "true"

outputs:
  resolved-pm:
    description: "The resolved package manager ('pnpm' or 'bun')"
    value: ${{ steps.detect-pm.outputs.pm }}

runs:
  using: "composite"
  steps:
    - name: Detect Package Manager & Version Strategy
      id: detect-pm
      shell: bash
      run: |
        INPUT_PM="${{ inputs.package-manager }}"
        if [ "$INPUT_PM" = "auto" ]; then
          if [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
            RESOLVED="bun"
          else
            RESOLVED="pnpm"
          fi
        else
          RESOLVED="$INPUT_PM"
        fi
        echo "pm=$RESOLVED" >> $GITHUB_OUTPUT
        echo "Resolved Package Manager: $RESOLVED"

        # Check if package.json already defines packageManager
        if [ "$RESOLVED" = "pnpm" ]; then
          if [ -f "package.json" ] && grep -q '"packageManager"' package.json; then
            echo "use_pkg_json=true" >> $GITHUB_OUTPUT
            echo "pnpm_version=" >> $GITHUB_OUTPUT
            echo "Found packageManager in package.json, pnpm/action-setup will read it automatically."
          else
            echo "use_pkg_json=false" >> $GITHUB_OUTPUT
            FALLBACK="${{ inputs.pnpm-version }}"
            if [ "$FALLBACK" = "lts" ] || [ "$FALLBACK" = "latest" ] || [ -z "$FALLBACK" ]; then
              FALLBACK="12.15.0"
            fi
            echo "pnpm_version=$FALLBACK" >> $GITHUB_OUTPUT
            echo "Using PNPM version: $FALLBACK"
          fi
        fi

    # Setup PNPM path (from package.json if present, to avoid "Multiple versions specified" conflict)
    - name: Setup PNPM (from package.json)
      if: steps.detect-pm.outputs.pm == 'pnpm' && steps.detect-pm.outputs.use_pkg_json == 'true'
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    # Setup PNPM path (from input version or LTS fallback)
    - name: Setup PNPM (LTS / Input version)
      if: steps.detect-pm.outputs.pm == 'pnpm' && steps.detect-pm.outputs.use_pkg_json != 'true'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.detect-pm.outputs.pnpm_version }}
        run_install: false

    - name: Setup Node.js (LTS) with PNPM cache
      if: steps.detect-pm.outputs.pm == 'pnpm'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Install dependencies via PNPM
      if: steps.detect-pm.outputs.pm == 'pnpm' && inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # Setup BUN path (LTS / Latest stable)
    - name: Setup Bun (LTS)
      if: steps.detect-pm.outputs.pm == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies via Bun
      if: steps.detect-pm.outputs.pm == 'bun' && inputs.install-deps == 'true'
      shell: bash
      run: bun install --frozen-lockfile
