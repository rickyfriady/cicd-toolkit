name: "CI - Self Verification & Review"

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: "Verification & Danger Review"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Runtime via Composite Action
        uses: ./composite/setup-runtime
        with:
          package-manager: "pnpm"
          node-version: "lts/*"
          pnpm-version: "lts"
          bun-version: "latest"
          install-deps: "true"

      - name: Verify Tool Versions
        run: |
          node --version
          pnpm --version

      - name: Typecheck
        run: pnpm run typecheck

      - name: Generate Quality & Security Reports
        run: |
          mkdir -p reports/lint reports/unit/coverage reports/knip reports/dependencies
          pnpm run danger:lint-report || true
          pnpm run test:coverage || true
          pnpm run knip:report || true
          pnpm audit --registry=https://registry.npmjs.org/ --json > reports/dependencies/audit.json || true

      - name: Run Danger Review Bot
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run danger:ci || npx --yes danger ci
