name: "Automated Semantic Release"

on:
  push:
    branches: [main, master, "feature/ci-cd/**"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in dry-run mode without publishing tag/release"
        required: false
        type: boolean
        default: false
      force-bump:
        description: "Force specific bump level: 'patch' | 'minor' | 'major'"
        required: false
        type: choice
        options:
          - "auto"
          - "patch"
          - "minor"
          - "major"
        default: "auto"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Semantic Versioning & Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Runtime via Composite Action
        uses: ./composite/setup-runtime
        with:
          package-manager: "pnpm"
          node-version: "lts/*"
          pnpm-version: "12.15.0"
          install-deps: "true"

      - name: Build Production Assets
        run: pnpm run build

      - name: Calculate Semantic Version & Generate Changelog
        id: release
        run: |
          BUMP_FLAG=""
          if [ "${{ inputs.force-bump }}" != "auto" ] && [ -n "${{ inputs.force-bump }}" ]; then
            BUMP_FLAG="--bump=${{ inputs.force-bump }}"
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          node dist/scripts/semantic-release.js $BUMP_FLAG $DRY_FLAG

      - name: Commit Updated Version & Changelog
        if: steps.release.outputs.has_release == 'true' && inputs.dry-run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          git commit -m "chore(release): bump version to ${{ steps.release.outputs.tag }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push skipped or not permitted"

      - name: Create Git Tag
        if: steps.release.outputs.has_release == 'true' && inputs.dry-run != true
        run: |
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}" || echo "Tag push skipped"

      - name: Package Release Assets
        if: steps.release.outputs.has_release == 'true' && inputs.dry-run != true
        run: |
          tar -czf "cicd-toolkit-${{ steps.release.outputs.tag }}.tar.gz" dist package.json README.md LICENSE

      - name: Publish GitHub Release
        if: steps.release.outputs.has_release == 'true' && inputs.dry-run != true
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_TAG;

            let body = `### Release ${tag}\n\nAutomated production release generated by Ricky Friadi CI/CD Toolkit.`;
            if (fs.existsSync('RELEASE_NOTES.tmp.md')) {
              body = fs.readFileSync('RELEASE_NOTES.tmp.md', 'utf-8');
            }

            console.log(`Creating or updating GitHub Release for ${tag}...`);
            let release;
            try {
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                body: body,
                draft: false,
                prerelease: false
              });
            } catch (err) {
              console.log(`Release creation note: ${err.message}. Fetching existing release...`);
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
            }

            const assetFile = `cicd-toolkit-${tag}.tar.gz`;
            if (fs.existsSync(assetFile) && release?.data?.id) {
              console.log(`Uploading release asset ${assetFile}...`);
              const assetData = fs.readFileSync(assetFile);
              try {
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id,
                  name: assetFile,
                  data: assetData
                });
              } catch (err) {
                console.log(`Asset upload notice: ${err.message}`);
              }
            }
